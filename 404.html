<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA fallback for client-side routing
    // Redirect all 404s to index.html
    var search = window.location.search;
    if (search) {
      window.location.href = '/' + search;
    } else {
      window.location.href = '/';
    }
  </script>
</head>

<body>
  <p>Redirecting to Eda's Cafe...</p>
</body>

</html>
